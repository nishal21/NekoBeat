# NekoBeat multi-platform release
# Docs: https://v2.tauri.app/distribute/pipelines/github/
#
# Triggers: tag v* or Actions → Release → Run workflow
#
# Desktop: Windows / Linux / macOS arm64 + Intel / Android
#
# Updater signing (createUpdaterArtifacts: true in tauri.conf.json):
#   TAURI_SIGNING_PRIVATE_KEY          = contents of .tauri/nekobeat.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD = password used with `tauri signer generate -p`
#   (Password is REQUIRED in CI — passwordless keys fail non-interactively.)
#
# Android APK signing (sideload / Play):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   If unset, CI generates an ephemeral keystore (uninstall old APK between runs).

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create draft GitHub release'
        type: boolean
        default: true
      build_android:
        description: 'Also build Android APK'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon (native on macos-latest)
          - platform: macos-latest
            args: >-
              --config src-tauri/tauri.desktop.conf.json
              --config src-tauri/tauri.macos.conf.json
              --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          # Intel Mac: native x86_64 on macos-15-intel (macos-13 retired Dec 2025)
          # Do NOT cross-compile from arm — glib-sys/pkg-config breaks
          - platform: macos-15-intel
            args: >-
              --config src-tauri/tauri.desktop.conf.json
              --config src-tauri/tauri.macos.conf.json
              --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: >-
              --config src-tauri/tauri.desktop.conf.json
              --config src-tauri/tauri.linux.conf.json
            rust_targets: ''
          - platform: windows-latest
            args: --config src-tauri/tauri.desktop.conf.json
            rust_targets: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Prepare updater signing env
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Missing secret TAURI_SIGNING_PRIVATE_KEY (paste entire .tauri/nekobeat.key)."
            exit 1
          fi
          if [ -z "$PW" ]; then
            echo "::error::Missing secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD."
            exit 1
          fi
          KEY_FILE="${RUNNER_TEMP}/tauri_updater.key"
          export KEY_FILE
          # Local key is a single base64 line (len 348). A trailing \n becomes
          # "Invalid symbol 10, offset 348" — do NOT append a newline.
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          raw = os.environ["KEY"].replace("\r\n", "\n").replace("\r", "\n")
          body = "\n".join(
              line for line in raw.split("\n")
              if line and not line.startswith("untrusted comment:")
          )
          # Keep only base64 alphabet (drops paste newlines/spaces)
          payload = re.sub(rb"[^A-Za-z0-9+/=]", b"", body.encode("utf-8"))
          if not payload:
              raise SystemExit("private key base64 body is empty after sanitize")
          if b"\n" in payload or 10 in payload:
              raise SystemExit("sanitize failed: newline still in payload")
          # Write EXACT bytes — no trailing newline (offset 348 == former bug)
          Path(os.environ["KEY_FILE"]).write_bytes(payload)
          print(f"updater key file ready: base64_len={len(payload)} trailing_nl=False")
          PY
          # tauri build reads TAURI_SIGNING_PRIVATE_KEY as path or contents
          echo "TAURI_SIGNING_PRIVATE_KEY=${KEY_FILE}" >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${PW}" >> "$GITHUB_ENV"

      - name: Linux system deps (WebKit + GStreamer)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            libunwind-dev \
            libasound2-dev \
            build-essential \
            curl wget file \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            gstreamer1.0-tools

      - name: macOS GStreamer
        if: startsWith(matrix.platform, 'macos')
        run: |
          brew update
          brew install gstreamer pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix gstreamer)/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Windows GStreamer (MSI + pkg-config)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          # The build-deps .exe hangs forever on /quiet in Actions. Use official MSIs + msiexec /qn.
          $ver = '1.26.5'
          $base = "https://gstreamer.freedesktop.org/data/pkg/windows/$ver/msvc"
          $runtime = "gstreamer-1.0-msvc-x86_64-$ver.msi"
          $devel = "gstreamer-1.0-devel-msvc-x86_64-$ver.msi"
          Write-Host "Downloading $runtime ..."
          curl.exe -fsSL --retry 3 -o runtime.msi "$base/$runtime"
          Write-Host "Downloading $devel ..."
          curl.exe -fsSL --retry 3 -o devel.msi "$base/$devel"

          function Install-Msi([string]$Msi, [string]$Log) {
            Write-Host "Installing $Msi (quiet, max 10 min)..."
            $p = Start-Process -FilePath 'msiexec.exe' -ArgumentList @(
              '/i', (Resolve-Path $Msi).Path,
              '/qn', '/norestart',
              "INSTALLDIR=C:\gstreamer",
              "/L*v", $Log
            ) -PassThru -NoNewWindow
            if (-not $p.WaitForExit(600000)) {
              try { Stop-Process -Id $p.Id -Force } catch {}
              throw "msiexec timed out after 10m for $Msi — see $Log"
            }
            if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
              Get-Content $Log -Tail 40 -ErrorAction SilentlyContinue
              throw "msiexec failed for $Msi exit=$($p.ExitCode)"
            }
            Write-Host "Installed $Msi (exit $($p.ExitCode))"
          }

          Install-Msi 'runtime.msi' 'gst-runtime.log'
          Install-Msi 'devel.msi' 'gst-devel.log'

          $root = 'C:\gstreamer\1.0\msvc_x86_64'
          if (-not (Test-Path "$root\lib\pkgconfig")) {
            Get-ChildItem 'C:\gstreamer' -Recurse -Depth 3 -ErrorAction SilentlyContinue | Select-Object -First 40 FullName
            throw "GStreamer missing pkgconfig at $root"
          }
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$root\" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_CONFIG_PATH=$root\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$root\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$root\lib" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          choco install pkgconfiglite -y --no-progress
          Write-Host "GStreamer Windows setup OK"
      - name: Fetch yt-dlp + chmod sidecars (Linux / macOS)
        if: matrix.platform != 'windows-latest'
        run: |
          mkdir -p src-tauri/bin
          OS=$(uname -s)
          ARCH=$(uname -m)
          if [ "$OS" = "Darwin" ]; then
            curl -fsSL --retry 3 -o src-tauri/bin/yt-dlp \
              https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos
          else
            curl -fsSL --retry 3 -o src-tauri/bin/yt-dlp \
              https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux
          fi
          chmod +x src-tauri/bin/yt-dlp
          chmod +x src-tauri/binaries/spotiflac-cli-* || true
          # Fail early if platform sidecar missing (Tauri externalBin)
          case "$OS-$ARCH" in
            Darwin-arm64)
              test -f src-tauri/binaries/spotiflac-cli-aarch64-apple-darwin
              ;;
            Darwin-x86_64)
              test -f src-tauri/binaries/spotiflac-cli-x86_64-apple-darwin
              ;;
            Linux-*)
              test -f src-tauri/binaries/spotiflac-cli-x86_64-unknown-linux-gnu
              ;;
          esac

      - name: Ensure Windows yt-dlp
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          if (-not (Test-Path "src-tauri/bin/yt-dlp.exe")) {
            curl.exe -fsSL --retry 3 -o src-tauri/bin/yt-dlp.exe `
              https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe
          }
          if (-not (Test-Path "src-tauri/binaries/spotiflac-cli-x86_64-pc-windows-msvc.exe")) {
            throw "Missing Windows spotiflac-cli sidecar in src-tauri/binaries/"
          }

      - name: Install frontend deps
        run: npm ci

      - name: Build & upload (tauri-action)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # TAURI_SIGNING_* already injected via GITHUB_ENV (password omitted when unset)
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'app-v__VERSION__' }}
          releaseName: "NekoBeat ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}"
          releaseBody: |
            ## NekoBeat

            Installers for this version:

            | Platform | Artifacts |
            |----------|-----------|
            | Windows | `.msi` / NSIS `.exe` (GStreamer runtime bundled) |
            | Linux | `.deb` / `.AppImage` |
            | macOS | `.dmg` (Apple Silicon + Intel) |
            | Android | `.apk` (same GitHub Release — `NekoBeat-*-android-*.apk`) |

            See the README for install notes.
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || true }}
          prerelease: false
          args: ${{ matrix.args }}

  publish-android:
    # Attach after desktop so the shared GitHub Release tag already exists.
    # always() so one failed desktop platform does not skip the APK.
    if: |
      always() &&
      !cancelled() &&
      (github.event_name != 'workflow_dispatch' || inputs.build_android)
    runs-on: ubuntu-22.04
    continue-on-error: true
    needs: publish-desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + platform
        run: |
          # Must match android.ndkVersion that Tauri/AGP resolve (CXX1104 if ndk.dir disagrees)
          sdkmanager --install "ndk;27.0.12077973" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Install Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Host build helpers
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config unzip curl xz-utils

      - name: Download GStreamer Android universal SDK
        run: |
          set -euo pipefail
          VER=1.28.4
          URL="https://gstreamer.freedesktop.org/data/pkg/android/${VER}/gstreamer-1.0-android-universal-${VER}.tar.xz"
          mkdir -p "$GITHUB_WORKSPACE/vendor"
          curl -fsSL --retry 3 -o /tmp/gst-android.tar.xz "$URL"
          # Tarball top-level is arm64/ armv7/ x86/ x86_64/
          tar -xJf /tmp/gst-android.tar.xz -C "$GITHUB_WORKSPACE/vendor"
          test -d "$GITHUB_WORKSPACE/vendor/arm64"
          test -f "$GITHUB_WORKSPACE/vendor/arm64/lib/libgstreamer-1.0.a"
          test -f "$GITHUB_WORKSPACE/vendor/arm64/include/gstreamer-1.0/gst/gst.h"
          echo "GSTREAMER_ROOT_ANDROID=$GITHUB_WORKSPACE/vendor" >> "$GITHUB_ENV"
          # sdk.dir only — do NOT set ndk.dir (conflicts with android.ndkVersion → CXX1104)
          mkdir -p src-tauri/gen/android
          echo "sdk.dir=$ANDROID_HOME" > src-tauri/gen/android/local.properties
          # Clear machine-local Windows gst path from committed gradle.properties
          sed -i '/^gstAndroidRoot=/d' src-tauri/gen/android/gradle.properties || true
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Apply CI Android cargo/pkg-config env
        run: bash scripts/ci-android-env.sh

      - name: Prebuild libgstreamer_android.so (Cerbero ndk-build)
        run: bash scripts/ci-build-gstreamer-android.sh

      - name: Install frontend deps
        run: npm ci

      - name: Ensure Android project (gen/)
        run: |
          if [ ! -f src-tauri/gen/android/app/build.gradle.kts ]; then
            echo "::error::src-tauri/gen/android is missing. Commit the patched Android project (GStreamer ndkBuild wiring)."
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Build SpotiFLAC Android sidecars
        run: bash scripts/build-spotiflac-android.sh

      - name: Fetch Android ffmpeg + yt-dlp
        run: bash scripts/fetch-android-native-tools.sh

      - name: Sync Android sidecars into jniLibs
        run: |
          bash scripts/sync-android-sidecars.sh
          # Umbrella lives in gen jniLibs; link/ is for cargo; marker skips Cerbero/PREBUILT
          test -f src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a/libgstreamer_android.so
          test -f src-tauri/android-gst/link/arm64-v8a/libgstreamer_android.so
          test -f src-tauri/android-gst/libs/arm64-v8a/.use_prebuilt_gst
          # Must not also sit under android-gst/libs (Duplicate resources vs jniLibs)
          test ! -f src-tauri/android-gst/libs/arm64-v8a/libgstreamer_android.so

      - name: Sync Android launcher icons (brand)
        run: bash scripts/sync-android-icons.sh

      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/ci-android-signing.sh

      - name: Build Android APK (aarch64)
        env:
          GSTREAMER_ROOT_ANDROID: ${{ env.GSTREAMER_ROOT_ANDROID }}
          PKG_CONFIG_SYSROOT_DIR: ''
          PKG_CONFIG_PATH: ''
        run: npm run tauri:android:build

      - name: Verify APK is signed (not *-unsigned)
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -type f | sort)
          if [[ ${#APKS[@]} -eq 0 ]]; then
            echo "::error::No APK produced"
            exit 1
          fi
          for apk in "${APKS[@]}"; do
            echo "APK: $apk"
            if [[ "$apk" == *unsigned* ]]; then
              echo "::error::Unsigned APK still produced: $apk"
              exit 1
            fi
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$apk" || \
              "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          done

      - name: Stage APK into release/ (same folder as desktop assets)
        id: stage_apk
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            # Match tauri-action tagName: app-v__VERSION__
            TAG="app-v${VERSION}"
          fi
          mkdir -p release
          mapfile -t APKS < <(find src-tauri/gen/android/app/build/outputs/apk -name '*-release*.apk' -type f ! -name '*unsigned*' | sort)
          if [[ ${#APKS[@]} -eq 0 ]]; then
            echo "::error::No signed release APK to stage"
            exit 1
          fi
          for apk in "${APKS[@]}"; do
            base="$(basename "$apk")"
            # Prefer abi from path: .../apk/arm64/release/app-arm64-release.apk
            abi="android"
            case "$apk" in
              */universal/*) abi="android-universal" ;;
              */arm64*/*|*/aarch64*/*) abi="android-arm64-v8a" ;;
              */armeabi*/*|*/arm*/*) abi="android-armeabi-v7a" ;;
              */x86_64*/*) abi="android-x86_64" ;;
              */x86/*) abi="android-x86" ;;
            esac
            out="release/NekoBeat-${VERSION}-${abi}.apk"
            cp -f "$apk" "$out"
            echo "Staged $apk → $out"
          done
          ls -lah release/
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Upload release/ APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nekobeat-android-apk
          path: release/*.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release (with desktop installers)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.stage_apk.outputs.tag }}
          name: NekoBeat v${{ steps.stage_apk.outputs.version }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || true }}
          files: release/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
