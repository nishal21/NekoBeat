# CI smoke — frontend typecheck + Linux desktop compile.
# Full Win/Mac/Linux/Android installers: workflow "Build all platforms"
# Signed GitHub Releases: workflow "Release" (tags v* / workflow_dispatch)

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build

  linux-compile:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            libunwind-dev \
            libasound2-dev
      - run: npm ci
      - name: Place yt-dlp for resources check
        run: |
          mkdir -p src-tauri/bin
          curl -fsSL --retry 3 -o src-tauri/bin/yt-dlp \
            https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux
          chmod +x src-tauri/bin/yt-dlp src-tauri/binaries/* || true
      - name: cargo check (Linux desktop)
        working-directory: src-tauri
        run: cargo check
