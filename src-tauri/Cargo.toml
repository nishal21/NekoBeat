[package]
name = "nekobeat"
version = "0.3.0"
description = "NekoBeat — library, stream, and HiFi"
authors = ["Nishal"]
edition = "2021"

[lib]
name = "nekobeat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rodio = { version = "0.19.0", default-features = false, features = ["symphonia-mp3", "symphonia-isomp4", "symphonia-wav", "symphonia-flac"] }
lofty = "0.22"
walkdir = "2.5.0"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1.36", features = ["full"] }
tauri-plugin-dialog = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "blocking", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
url = "2.5"
urlencoding = "2.1.3"
regex = "1.12"
chrono = "0.4"
discord-rich-presence = "1.1.0"
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-updater = "2.10.0"
tauri-plugin-single-instance = { version = "2.4.3", features = ["semver"] }
tauri-plugin-process = "2.3.1"
parking_lot = "0.12"
once_cell = "1.19"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
